name: Weekly blackboard schedule

on:
  schedule:
    # Every Sunday 20:00 JST = 11:00 UTC
    - cron: "0 11 * * 0"
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "diagram/**"
      - "**/*.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly HTML
        run: node src/generate.js --source=school

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Email the public URL
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url || 'https://awayuki-ai.github.io/weekly-blackboard-schedule/' }}
        run: node src/send-mail.js
