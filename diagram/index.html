<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Driven School 2026　卒業制作</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #2c2c2c;
        --muted: #5a6570;
        --paper: #f7f4ee;
        --sheet: #fffcf7;
        --dayori: #3b82c4;
        --dayori-soft: #e7f2fb;
        --board: #1f4d36;
        --board-soft: #e7f0ea;
        --font-h: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
        --font-b: "BIZ UDGothic", "Hiragino Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-b);
        color: var(--ink);
        background:
          radial-gradient(ellipse at 50% 0%, #fff 0%, var(--paper) 70%);
      }
      .sheet {
        min-height: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 28px 56px;
        position: relative;
      }
      header {
        text-align: center;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0;
        font-family: var(--font-h);
        font-size: 28pt;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.35;
      }
      .role {
        margin: 8px 0 0;
        font-family: var(--font-h);
        font-size: 16pt;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .doors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        align-items: stretch;
      }
      .door {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        background: var(--sheet);
        border-radius: 18px;
        overflow: hidden;
        border: 2px solid #d7dde3;
        box-shadow: 0 10px 28px rgba(60, 70, 80, 0.08);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .door:hover,
      .door:focus-visible {
        transform: translateY(-3px);
        box-shadow: 0 16px 36px rgba(60, 70, 80, 0.14);
      }
      .door:focus-visible {
        outline: 3px solid var(--dayori);
        outline-offset: 3px;
      }
      .door.board:focus-visible { outline-color: var(--board); }
      .door.dayori { border-color: #b7d3ea; background: var(--dayori-soft); }
      .door.board { border-color: #9cbfab; background: var(--board-soft); }
      .thumb {
        height: 280px;
        overflow: hidden;
        position: relative;
        pointer-events: none;
        background: #fff;
      }
      .thumb iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 900px;
        border: 0;
        transform: scale(0.42);
        transform-origin: top left;
      }
      .copy {
        padding: 14px 16px 16px;
      }
      .copy h2 {
        margin: 0;
        font-family: var(--font-h);
        font-size: 20pt;
        font-weight: 700;
      }
      .door.dayori h2 { color: var(--dayori); }
      .door.board h2 { color: var(--board); }
      .copy p {
        margin: 8px 0 0;
        font-size: 16pt;
        line-height: 1.55;
      }
      .open {
        display: inline-block;
        margin-top: 10px;
        font-family: var(--font-h);
        font-size: 13pt;
        font-weight: 700;
      }
      .door.dayori .open { color: var(--dayori); }
      .door.board .open { color: var(--board); }
      .whisper {
        display: block;
        width: fit-content;
        margin: 18px auto 0;
        font-family: var(--font-h);
        font-size: 11pt;
        font-weight: 500;
        color: #d4cfc6;
        text-decoration: none;
        letter-spacing: 0.08em;
      }
      .whisper:hover { color: #b7b1a7; }
      .whisper:focus-visible {
        outline: 1px solid #cfc8bc;
        outline-offset: 3px;
        color: #b7b1a7;
      }
      .sign {
        position: absolute;
        right: 28px;
        bottom: 18px;
        margin: 0;
        font-family: var(--font-h);
        font-size: 11pt;
        color: #8a9198;
        letter-spacing: 0.04em;
      }
      @media (max-width: 900px) {
        .doors { grid-template-columns: 1fr; }
        h1 { font-size: 22pt; }
        .sign { position: static; text-align: right; margin-top: 24px; }
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header>
        <h1>AI-Driven School 2026　卒業制作</h1>
        <p class="role">第１期 金曜クラス　cellグループ　永田陽香</p>
      </header>
      <div class="doors">
        <a class="door dayori" href="dayori.html">
          <div class="thumb">
            <iframe src="dayori.html" title="" tabindex="-1" aria-hidden="true"></iframe>
          </div>
          <div class="copy">
            <h2>学級便り</h2>
            <p>文章は苦ではない。痛いのは写真の配置</p>
            <span class="open">図解を開く →</span>
          </div>
        </a>
        <a class="door board" href="b.html">
          <div class="thumb">
            <iframe src="b.html" title="" tabindex="-1" aria-hidden="true"></iframe>
          </div>
          <div class="copy">
            <h2>今週の予定（黒板）</h2>
            <p>毎週月曜、予定の紙を係に渡すのを忘れる</p>
            <span class="open">図解を開く →</span>
          </div>
        </a>
      </div>
      <a class="whisper" href="learned.html">半年で学んだこと</a>
      <p class="sign">2026年3月6日〜2026年8月28日</p>
    </main>
  </body>
</html>
